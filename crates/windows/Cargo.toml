[package]
name = "threat-atlas"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Native SOC screensaver displaying public threat-map telemetry"

[dependencies]
threat-atlas-core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
tao = "=0.37.2"
softbuffer = "=0.4.8"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation"] }

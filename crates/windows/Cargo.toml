[package]
name = "threat-atlas"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Native SOC screensaver displaying public threat-map telemetry"
default-run = "threat-atlas"

[[bin]]
name = "threat-atlas-soc"
path = "src/soc_main.rs"

[dependencies]
threat-atlas-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tao = "=0.37.2"
softbuffer = "=0.4.8"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_Networking_WinHttp", "Win32_Security_Credentials", "Win32_Graphics_Gdi", "Win32_UI_Shell"] }

name: Build and check screensavers
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all --check
      - run: cargo +stable test --workspace --locked
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +stable install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
      - run: python3 scripts/check-source.py
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/build-macos.sh --universal
      - run: python3 scripts/test-updater.py "dist/Threat Atlas SOC.app/Contents/MacOS/ThreatAtlasUpdater"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ThreatAtlas-macOS
          path: dist/ThreatAtlas-macOS.zip
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'updater/Update-ThreatAtlas.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
      - run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ThreatAtlas-Windows-binary
          path: dist/ThreatAtlas.scr
  msi:
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ThreatAtlas-Windows-binary
          path: dist
      - run: sudo apt-get update && sudo apt-get install -y msitools wixl
      - run: bash scripts/build-msi.sh
      - run: python3 scripts/verify-msi.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ThreatAtlas-Windows-MSI
          path: dist/*.msi
  updater-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./scripts/test-updater.ps1
  msi-install-test:
    needs: msi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ThreatAtlas-Windows-MSI
          path: dist
      - run: ./scripts/test-msi.ps1

name: Windows standalone SOC
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-soc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: ./scripts/build-windows-soc.ps1
      - run: ./scripts/test-windows-soc.ps1
      - run: ./scripts/build-windows-soc-installer.ps1
      - run: ./scripts/test-windows-soc-installer.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: ThreatAtlas-Windows-SOC-review
          path: |
            dist/AtlasSOC-Windows-*.zip
            dist/AtlasSOC-Setup-*.exe
